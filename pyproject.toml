[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suk"
dynamic = ["version"]
description = "Disposable temp-mail inbox — Python SDK and CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "curl-cffi>=0.15.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
suk = "suk.cli:main"

[project.urls]
Homepage = "https://github.com/forshaur/suk"
"Bug Tracker" = "https://github.com/forshaur/suk/issues"

[tool.setuptools.dynamic]
version = { attr = "suk.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["suk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
